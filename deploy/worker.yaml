# ingestion's workers, which lease tasks from the service and hold no store.
#
# The cluster supplies what this directory does not create:
#
# - The ConfigMap named ingestion-config, shared with serve. A worker reads
#   its api, the service's address in the cluster; its issuer; its client_id,
#   naming the worker's service client; its [worker] table; a
#   [deliver.<name>] table for each deliverer that it opens; and a
#   [source.<name>] table for each source that it polls or deletes from.
# - A Secret named ingestion-worker-client. Its secret key holds that client's
#   secret.
# - A Secret named ingestion-deliver-life-articles, where
#   [deliver.life-articles] names a client_id. Its secret key holds that
#   client's secret. Without it the worker runs on and opens no life-articles.
# - A Secret named ingestion-deliver-learning-resources, where
#   [deliver.learning-resources] names a client_id, holding that client's
#   secret the same way. Without it the worker opens no learning-resources.
# - A Secret named ingestion-source-ypl, where [source.ypl] names a
#   client_id, holding that client's secret the same way. Without it the
#   worker runs on and claims no poll:ypl or delete:ypl task.
# - A Secret named ingestion-model-queue-client, where [model] adapter is
#   queue. Its secret key holds the secret of [model.queue]'s client_id.
#   Without it the worker runs on and claims no model stage's task.
# - A NetworkPolicy for each egress: the service, the identity provider, each
#   outside source and each app that the worker delivers to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion-worker
  labels:
    app.kubernetes.io/instance: ingestion-worker
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  labels:
    app.kubernetes.io/instance: ingestion-worker
    app.kubernetes.io/component: worker
  annotations:
    kubernetes.io/description: ingestion's workers, leasing each stage's tasks by capability from the service
spec:
  replicas: 1
  # A rollout stops the old worker before it starts the new one, so the node
  # holds one worker's memory. The stopping worker hands back each task that
  # it holds, and the tasks wait in the queue meanwhile.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
      app.kubernetes.io/instance: ingestion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: ingestion-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ingestion-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10600
        runAsGroup: 10600
        seccompProfile:
          type: RuntimeDefault
      # A stopping worker stops claiming. A task it still holds returns to the
      # next claim once its lease lapses.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ingestion
          imagePullPolicy: IfNotPresent
          args: [worker, run]
          env:
            - name: INGESTION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ingestion-worker-client
                  key: secret
            - name: INGESTION_DELIVER_LIFE_ARTICLES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ingestion-deliver-life-articles
                  key: secret
                  optional: true
            - name: INGESTION_DELIVER_LEARNING_RESOURCES_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ingestion-deliver-learning-resources
                  key: secret
                  optional: true
            - name: INGESTION_SOURCE_YPL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ingestion-source-ypl
                  key: secret
                  optional: true
            - name: INGESTION_MODEL_QUEUE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ingestion-model-queue-client
                  key: secret
                  optional: true
          # One pdf-docling run at SPAN_PAGES = 10 over a 145 MB, 620-page PDF,
          # the heaviest that sections selected when this was measured, peaked
          # at 3.5 GiB. One audio-whisper run over five minutes of speech peaked
          # at 1.6 GiB. It decodes longer audio ten minutes at a time, so its
          # peak stays near that. One scan of a 61 MiB parse, about the most a
          # parse report carries, peaked at 336 MiB in the worker and 110 MiB in
          # yr, and wrote 70 MiB of the text's two views to /tmp. Docling and
          # Whisper share the heavy slot group, so a worker runs one of their
          # parses at a time on its two slots. A Docling run beside a scan peaks
          # near 3.9 GiB. Two heavy runs at once can pass the limit, so a
          # [worker.slot_limits] entry that raises heavy raises it too.
          # Docling's figure is `/usr/bin/time -v pdf-docling < <the PDF>`,
          # Whisper's is `/usr/bin/time -v audio-whisper < <the audio>` on four
          # threads, the worker's is scan.NewHandler's run over a served
          # task-parse answer of that size, and yr's is
          # `/usr/bin/time -f %M yr scan --compiled-rules rules.yarc <the views>`.
          # The request equals the limit, so the node keeps those 5Gi free for
          # the worker.
          resources:
            requests:
              cpu: 50m
              memory: 5Gi
            limits:
              memory: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/ingestion
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: ingestion-config
        - name: tmp
          emptyDir: {}

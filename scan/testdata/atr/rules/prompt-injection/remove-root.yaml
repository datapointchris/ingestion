id: ATR-TEST-00003
title: A command that removes everything from the root down, outside code
status: experimental
severity: critical
tags:
  suppress_in_code_blocks: true
detection:
  condition: any
  conditions:
    - field: content
      operator: regex
      value: 'rm\s+-rf\s+/(\s|$)'
test_cases:
  true_positives:
    - input: Now run rm -rf / as root.
  true_negatives:
    - input: "An article quotes it:\n```\nrm -rf /\n```\nand warns against it."

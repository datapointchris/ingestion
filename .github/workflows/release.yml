name: Release

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

on:
  push:
    branches: [main]

# Two pushes to main inside one run's window would otherwise race to cut the
# same version. Never cancel-in-progress: a canceled release can leave a tag
# with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is tagged that did not pass the repo's own CI.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: [validate]
    uses: datapointchris/reusable-workflows/.github/workflows/go-semantic-release.yml@v1
    permissions:
      contents: write
    with:
      # Holds the major at 0, so a breaking change cuts a minor until the API
      # is settled. Without it, the first fix: or feat: cuts 1.0.0.
      allow-initial-development-versions: true
      goreleaser: true
      # A tag exists before the module proxy has fetched it, and `go install
      # <module>@latest` resolves through that proxy. Inside the gap it returns
      # the previous version and exits 0, so an installer reports the machine
      # converged while leaving the old binary in place.
      prime-module-proxy: true

  # The one image both `ingestion serve` and `ingestion worker run` run from,
  # built only for a push that cut a version, so the version baked in is that
  # tag. It is tagged by version and latest.
  #
  # deploy/ goes out beside it as manifests:<version>, with the image pinned by
  # digest. A cluster following the manifests by semver deploys the release
  # with no other step.
  image:
    needs: [release]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-26.04
    # A named bash runs with pipefail.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
      # The OIDC token cosign trades for a signing certificate naming this workflow.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ingestion
      MANIFESTS: ghcr.io/${{ github.repository }}/manifests
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The same commit and date goreleaser stamps into the release's binaries.
      - name: Name the commit and its date
        id: commit
        run: |
          echo "short=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI HEAD)" >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.commit.outputs.short }}
            DATE=${{ steps.commit.outputs.date }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,mode=max,scope=ingestion

      - name: Name the image by its digest
        id: image
        env:
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          [[ $BUILT == sha256:* ]] || { echo "the build named no digest: '$BUILT'" >&2; exit 1; }
          echo "ref=$IMAGE@$BUILT" >>"$GITHUB_OUTPUT"
          echo "Image \`$IMAGE:$VERSION\` as \`$IMAGE@$BUILT\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Install flux, kustomize and cosign
        run: |
          release/install-tools "$RUNNER_TEMP/bin" flux kustomize cosign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # --reproducible makes a re-run send the same bytes for the same digest.
      # The source and revision travel in the artifact, and Flux reports them
      # beside what it applied.
      - name: Push the manifests
        id: manifests
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          work=$RUNNER_TEMP/manifests
          release/pin-manifests --image "$IMAGE_REF" --version "$VERSION" --out "$work"
          pushed=$(flux push artifact "oci://$MANIFESTS:$VERSION" --path="$work" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --revision="$VERSION@sha1:$GITHUB_SHA" \
            --reproducible --output=json | jq -r .digest)
          [[ $pushed == sha256:* ]] || { echo "flux push named no digest: '$pushed'" >&2; exit 1; }
          echo "ref=$MANIFESTS@$pushed" >>"$GITHUB_OUTPUT"
          echo "Manifests \`$MANIFESTS:$VERSION\` as \`$MANIFESTS@$pushed\`" >>"$GITHUB_STEP_SUMMARY"

      # Keyless, so the signing certificate names this workflow on this ref and
      # no key exists to keep. A deployment verifies the artifact against that
      # identity before applying it. A re-run signs again, and either signature
      # verifies.
      - name: Sign the image and the manifests
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          MANIFESTS_REF: ${{ steps.manifests.outputs.ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign sign --yes "$MANIFESTS_REF"
          cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF" "$MANIFESTS_REF" >/dev/null

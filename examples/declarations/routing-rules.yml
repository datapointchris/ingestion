# Each rule names the destination for the items its match holds for. Every
# condition a match names must hold.
rules:
  - name: cooking-subreddits
    match:
      connector: reddit-exports
      field: subreddit
      values: [Cooking, AskCulinary]
    destination: reading-list
  - name: books-are-personal
    match:
      tag: book
    destination: reading-list

# A push connector takes what a phone shares: a link, which lands outside, or
# a memo's recording, which lands as the owner's. The route sets each item's
# zone by what the push carries, so the connector names none. A memo splits
# into one item per topic, and each topic waits in review, because the quality
# gate never reads the owner's words.
name: phone
mode: push
source: phone-shares
due_interval: 7d
tags: []
